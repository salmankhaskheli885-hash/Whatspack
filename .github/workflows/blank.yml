name: Build Android APK & Download Website

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-configuration-cache -Djava.awt.headless=true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatReader-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Direct APK Download Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ChatReader.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest ChatReader.apk --clobber
          else
            gh release create latest ChatReader.apk \
              --title "ChatReader Latest APK" \
              --notes "Latest ChatReader Android APK for WhatsApp & WA Business read-only saving."
          fi

      - name: Prepare Website Bundle
        run: |
          mkdir -p _site
          cp -r docs/* _site/
          cp app/build/outputs/apk/debug/app-debug.apk _site/ChatReader.apk

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-website:
    needs: build
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Download Website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
